name: build

# Frontend assets, native entry points and bundle resources all affect startup.
# Build on every PR / main push, including changes outside src-tauri.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  desktop:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis

    defaults:
      run:
        working-directory: pa-terminal

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pa-terminal/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: pa-terminal/src-tauri -> target
          key: desktop-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # Compile and link the executable, embed the production frontend, and
      # package icons / legal resources. No release credentials are needed.
      - name: Build desktop application
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

      - name: Verify Windows startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-startup-smoke.ps1 -Executable ./src-tauri/target/${{ matrix.target }}/release/pa-terminal.exe

      - name: Check official feature
        working-directory: pa-terminal/src-tauri
        run: cargo check --locked --features official
