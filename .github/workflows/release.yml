name: release

# GitHub Release を Publish したら、タグのバージョンをアプリへ設定し、その Release に
# macOS (Intel + Apple Silicon の universal) と Windows (x64) のインストーラを追加する。
# 全検証の成功後に Latest へ昇格するため、ビルド中や失敗時は旧版の自動更新を維持する。
on:
  release:
    types: [published]
  # Release を作らず、署名済み成果物だけを Actions artifacts で確認する用途。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      # Publish 直後の Release は GitHub により Latest になり得る。成果物と latest.json の
      # 検証が終わるまでは旧版を /releases/latest に残す。
      - name: keep the previous stable release as latest during the build
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f make_latest=false >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node pa-terminal/scripts/set-release-version.mjs "$RELEASE_TAG" pa-terminal
          node pa-terminal/scripts/verify-release-version.mjs "$RELEASE_TAG" pa-terminal

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      # 各ジョブが同じ Release の latest.json を更新するため競合させない。
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundle-root: pa-terminal/src-tauri/target/universal-apple-darwin/release/bundle
            # 公式ビルド系統（トライアル/ソフトロック有効）。feature はここでだけ指定する
            args: "--target universal-apple-darwin --features official"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-root: pa-terminal/src-tauri/target/release/bundle
            args: "--features official"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pa-terminal/package-lock.json

      - name: set app version from release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node pa-terminal/scripts/set-release-version.mjs "$RELEASE_TAG" pa-terminal

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal ビルドは両アーキテクチャの std が要る
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: pa-terminal/src-tauri -> target

      - name: install frontend deps
        working-directory: pa-terminal
        run: npm ci

      - name: typecheck
        working-directory: pa-terminal
        run: npx tsc --noEmit

      - name: verify generated third-party notices
        working-directory: pa-terminal
        run: npm run check:third-party-notices

      - name: require signed updater keys
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          missing=0
          for value_name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            TAURI_UPDATER_PUBLIC_KEY
          do
            if [[ -z "${!value_name:-}" ]]; then
              echo "::error::Required updater credential is not configured: ${value_name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          node pa-terminal/scripts/write-updater-config.mjs pa-terminal/src-tauri/tauri.ci.conf.json

      - name: require Apple signing and notarization secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for secret_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required Apple signing secret is not configured: ${secret_name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS の Developer ID 署名 + 公証。公開repo側のActions secretsを使う。
          # macOS ジョブでは直前の preflight が6項目すべてを必須検査する。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: pa-terminal
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json
          # Publish 済み Release をIDで直接指定し、入力済みのタイトルと本文を変更しない。
          # 手動実行では両方とも空になり、Release へはアップロードしない。
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          tagName: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          releaseBody: ${{ github.event_name == 'release' && github.event.release.body || '' }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      # tauri-action は .app を公証してから DMG を作る。実際に配布する最外層の
      # DMG にも公証 ticket を付け、オフラインでも Gatekeeper が確認できるようにする。
      - name: notarize and staple universal DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg_path="$(find pa-terminal/src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "::error::The macOS build did not produce a DMG"
            exit 1
          fi
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      # tauri-action は上の公証前にDMGをuploadするため、公証・staple後の同名DMGで
      # Release assetを置き換える。
      - name: replace macOS DMG in release
        if: runner.os == 'macOS' && github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          dmg_path="$(find pa-terminal/src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          gh release upload "$RELEASE_TAG" "$dmg_path" --clobber

      - name: write release checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        # target全体にはWindowsのWiX/NSIS用ツールもあるため、配布物のbundleだけを対象にする。
        run: |
          checksum_args=("${{ matrix.bundle-root }}" "SHA256SUMS-${{ matrix.target }}.txt")
          if [[ -n "$RELEASE_TAG" ]]; then
            checksum_args+=("${RELEASE_TAG#v}")
          fi
          node pa-terminal/scripts/write-release-checksums.mjs "${checksum_args[@]}"

      - name: upload checksums to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "SHA256SUMS-${{ matrix.target }}.txt" --clobber

      - name: verify signed and notarized universal DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg_path="$(find pa-terminal/src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "::error::The macOS build did not produce a DMG"
            exit 1
          fi
          bash scripts/verify-macos-dmg.sh --team-id "$EXPECTED_TEAM_ID" "$dmg_path"

      # workflow_dispatch でも成果物を持ち帰れるように
      - uses: actions/upload-artifact@v4
        with:
          name: paterminal-${{ matrix.target }}
          path: |
            pa-terminal/src-tauri/target/release/bundle/**/*.dmg
            pa-terminal/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            pa-terminal/src-tauri/target/release/bundle/**/*.exe
            pa-terminal/src-tauri/target/release/bundle/**/*.msi
            pa-terminal/src-tauri/target/release/bundle/**/*.sig
            pa-terminal/src-tauri/target/release/bundle/**/*.tar.gz
            pa-terminal/src-tauri/target/universal-apple-darwin/release/bundle/**/*.sig
            pa-terminal/src-tauri/target/universal-apple-darwin/release/bundle/**/*.tar.gz
            SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: warn

  verify-updater-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: download updater manifest and release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/paterminal-updater"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$release_dir"
          release_api_url="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api "$release_api_url" > "$release_dir/release.json"
      # tauri-action v1 はGitHub APIのasset URLを出力する。匿名updaterでも取得できる
      # 公開Releaseの安定したdownload URLに置き換えてから検証・再uploadする。
      - name: normalize updater URLs for public downloads
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node pa-terminal/scripts/normalize-updater-json.mjs \
            "$RUNNER_TEMP/paterminal-updater/latest.json" \
            "$RUNNER_TEMP/paterminal-updater/release.json" \
            "$GITHUB_REPOSITORY" \
            "$RELEASE_TAG"
      - name: replace updater manifest in release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/paterminal-updater/latest.json" --clobber
      - name: verify updater targets, URLs, and signatures
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node pa-terminal/scripts/verify-updater-json.mjs "$RUNNER_TEMP/paterminal-updater/latest.json" "$RELEASE_TAG"

  promote-release:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: verify-updater-release
    runs-on: ubuntu-latest
    steps:
      - name: mark the verified release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f make_latest=true >/dev/null
