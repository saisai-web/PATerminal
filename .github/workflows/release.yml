name: release

# GitHub Release を Publish したら、タグのバージョンをアプリへ設定し、その Release に
# macOS (Intel + Apple Silicon の universal) と Windows (x64) のインストーラを追加する。
# 全検証の成功後に Latest へ昇格するため、ビルド中や失敗時は旧版の自動更新を維持する。
on:
  release:
    types: [published]
  # タグなしならActions artifactsのみ、既存タグを指定すれば失敗したReleaseを再ビルドする。
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing published Release tag to rebuild; leave blank for artifacts only"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="${EVENT_RELEASE_TAG:-${INPUT_RELEASE_TAG:-}}"
          if [[ -z "$release_tag" ]]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "id=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "No release tag supplied; this run will only upload workflow artifacts."
            exit 0
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a v-prefixed semantic version: $release_tag"
            exit 1
          fi
          if [[ -n "${EVENT_RELEASE_ID:-}" ]]; then
            release_id="$EVENT_RELEASE_ID"
            prerelease="$EVENT_PRERELEASE"
          else
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")"
            release_id="$(jq -r .id <<<"$release_json")"
            prerelease="$(jq -r .prerelease <<<"$release_json")"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Publish 直後の Release は GitHub により Latest になり得る。成果物と latest.json の
      # 検証が終わるまでは旧版を /releases/latest に残す。
      - name: keep the previous stable release as latest during the build
        if: steps.release.outputs.tag != '' && steps.release.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          previous_release_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.id != $CURRENT_RELEASE_ID and .draft == false and .prerelease == false) | [.published_at, .id] | @tsv" \
              | sort | tail -n 1 | cut -f2
          )"
          if [[ -z "$previous_release_id" ]]; then
            echo "No previous stable release exists; the first release will remain Latest during the build."
            exit 0
          fi
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$previous_release_id" \
            -f make_latest=true >/dev/null
          echo "Kept release ID $previous_release_id as Latest until verification completes."

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag || github.ref }}

      - name: validate release version
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node pa-terminal/scripts/set-release-version.mjs "$RELEASE_TAG" pa-terminal
          node pa-terminal/scripts/verify-release-version.mjs "$RELEASE_TAG" pa-terminal

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      # 各ジョブが同じ Release の latest.json を更新するため競合させない。
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundle-root: pa-terminal/src-tauri/target/universal-apple-darwin/release/bundle
            # 公式ビルド系統（トライアル/ソフトロック有効）。feature はここでだけ指定する
            args: "--target universal-apple-darwin --features official"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-root: pa-terminal/src-tauri/target/release/bundle
            args: "--features official"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pa-terminal/package-lock.json

      - name: set app version from release tag
        if: needs.prepare-release.outputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: node pa-terminal/scripts/set-release-version.mjs "$RELEASE_TAG" pa-terminal

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal ビルドは両アーキテクチャの std が要る
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: pa-terminal/src-tauri -> target

      - name: install frontend deps
        working-directory: pa-terminal
        run: npm ci

      - name: typecheck
        working-directory: pa-terminal
        run: npx tsc --noEmit

      - name: verify generated third-party notices
        working-directory: pa-terminal
        run: npm run check:third-party-notices

      # 配布済みアプリは TAURI_UPDATER_PUBLIC_KEY を埋め込み、その鍵で成果物の署名を検証する。
      # 秘密鍵(secret)と公開鍵(variable)が別ペアだと、ビルドは成功しても全ユーザーの
      # アプリ内更新が「署名付きアップデートをインストールできませんでした」で失敗する
      # (v0.2.2/v0.2.3 で発生)。鍵をローテーションするときは両方を同時に差し替えること。
      - name: require signed updater keys
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          missing=0
          for value_name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            TAURI_UPDATER_PUBLIC_KEY
          do
            if [[ -z "${!value_name:-}" ]]; then
              echo "::error::Required updater credential is not configured: ${value_name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          node pa-terminal/scripts/write-updater-config.mjs pa-terminal/src-tauri/tauri.ci.conf.json

      # ビルド前に秘密鍵でダミーファイルへ署名し、公開鍵で検証できることを確かめる。
      - name: verify updater signing key matches the embedded public key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        # workflow_dispatch で古いタグを再ビルドするとスクリプトが無いことがあるため存在を確認する。
        run: |
          if [[ -f pa-terminal/scripts/check-updater-keypair.mjs ]]; then
            node pa-terminal/scripts/check-updater-keypair.mjs
          else
            echo "::warning::This tag predates check-updater-keypair.mjs; the key pair is not verified before the build"
          fi

      - name: require Apple signing and notarization secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for secret_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required Apple signing secret is not configured: ${secret_name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS の Developer ID 署名 + 公証。公開repo側のActions secretsを使う。
          # macOS ジョブでは直前の preflight が6項目すべてを必須検査する。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: pa-terminal
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json
          # Publish 済み Release をIDで直接指定し、入力済みのタイトルと本文を変更しない。
          # タグなしの手動実行では両方とも空になり、Release へはアップロードしない。
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.release_tag }}
          releaseBody: ${{ github.event_name == 'release' && github.event.release.body || '' }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      # tauri-action は .app を公証してから DMG を作る。実際に配布する最外層の
      # DMG にも公証 ticket を付け、オフラインでも Gatekeeper が確認できるようにする。
      - name: notarize and staple universal DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg_path="$(find pa-terminal/src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "::error::The macOS build did not produce a DMG"
            exit 1
          fi
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      # tauri-action は上の公証前にDMGをuploadするため、公証・staple後の同名DMGで
      # Release assetを置き換える。
      - name: replace macOS DMG in release
        if: runner.os == 'macOS' && needs.prepare-release.outputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          dmg_path="$(find pa-terminal/src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          gh release upload "$RELEASE_TAG" "$dmg_path" --clobber

      # README は /releases/latest/download/<固定名> でワンクリックダウンロードさせる。
      # 成果物名にはバージョンが入るため、内容が同一のバージョン無し別名を追加で置く。
      # bundle 外へコピーしてから upload し、チェックサム対象には含めない。
      - name: upload version-less download aliases
        if: needs.prepare-release.outputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          alias_dir="$RUNNER_TEMP/download-aliases"
          mkdir -p "$alias_dir"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            src="$(find pa-terminal/src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
            dest="$alias_dir/PATerminal-macOS-universal.dmg"
          else
            src="$(find pa-terminal/src-tauri/target -type f -path '*/bundle/nsis/*-setup.exe' -print -quit)"
            dest="$alias_dir/PATerminal-Windows-x64-setup.exe"
          fi
          if [[ -z "$src" ]]; then
            echo "::error::No installer found to alias for $RUNNER_OS"
            exit 1
          fi
          cp "$src" "$dest"
          gh release upload "$RELEASE_TAG" "$dest" --clobber

      - name: write release checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        # target全体にはWindowsのWiX/NSIS用ツールもあるため、配布物のbundleだけを対象にする。
        run: |
          checksum_args=("${{ matrix.bundle-root }}" "SHA256SUMS-${{ matrix.target }}.txt")
          if [[ -n "$RELEASE_TAG" ]]; then
            checksum_args+=("${RELEASE_TAG#v}")
          fi
          node pa-terminal/scripts/write-release-checksums.mjs "${checksum_args[@]}"

      - name: upload checksums to release
        if: needs.prepare-release.outputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "SHA256SUMS-${{ matrix.target }}.txt" --clobber

      - name: verify signed and notarized universal DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg_path="$(find pa-terminal/src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "::error::The macOS build did not produce a DMG"
            exit 1
          fi
          bash scripts/verify-macos-dmg.sh --team-id "$EXPECTED_TEAM_ID" "$dmg_path"

      # workflow_dispatch でも成果物を持ち帰れるように
      - uses: actions/upload-artifact@v4
        with:
          name: paterminal-${{ matrix.target }}
          path: |
            pa-terminal/src-tauri/target/release/bundle/**/*.dmg
            pa-terminal/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            pa-terminal/src-tauri/target/release/bundle/**/*.exe
            pa-terminal/src-tauri/target/release/bundle/**/*.msi
            pa-terminal/src-tauri/target/release/bundle/**/*.sig
            pa-terminal/src-tauri/target/release/bundle/**/*.tar.gz
            pa-terminal/src-tauri/target/universal-apple-darwin/release/bundle/**/*.sig
            pa-terminal/src-tauri/target/universal-apple-darwin/release/bundle/**/*.tar.gz
            SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: warn

  verify-updater-release:
    if: needs.prepare-release.outputs.release_tag != ''
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      # 検証スクリプトはタグではなくワークフローを実行した ref から使う。
      # 古いタグを再ビルドしても最新の署名検証が効く。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: download updater manifest and release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/paterminal-updater"
          mkdir -p "$release_dir/assets"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$release_dir"
          release_api_url="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api "$release_api_url" > "$release_dir/release.json"
          # latest.json の署名を、実際に配布する成果物と公開鍵で検証するために取得する。
          gh release download "$RELEASE_TAG" --dir "$release_dir/assets" \
            --pattern '*.tar.gz' --pattern '*.exe' --pattern '*.msi' --pattern '*.sig'
      # tauri-action v1 はGitHub APIのasset URLを出力する。匿名updaterでも取得できる
      # 公開Releaseの安定したdownload URLに置き換えてから検証・再uploadする。
      - name: normalize updater URLs for public downloads
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          node pa-terminal/scripts/normalize-updater-json.mjs \
            "$RUNNER_TEMP/paterminal-updater/latest.json" \
            "$RUNNER_TEMP/paterminal-updater/release.json" \
            "$GITHUB_REPOSITORY" \
            "$RELEASE_TAG"
      - name: replace updater manifest in release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/paterminal-updater/latest.json" --clobber
      # 公開鍵で検証できない署名なら失敗し、promote-release へ進まず旧版が Latest のまま残る。
      - name: verify updater targets, URLs, and signatures
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node pa-terminal/scripts/verify-updater-json.mjs \
            "$RUNNER_TEMP/paterminal-updater/latest.json" "$RELEASE_TAG" \
            --assets "$RUNNER_TEMP/paterminal-updater/assets"

  promote-release:
    if: needs.prepare-release.outputs.release_tag != '' && needs.prepare-release.outputs.prerelease != 'true'
    needs: [prepare-release, verify-updater-release]
    runs-on: ubuntu-latest
    steps:
      - name: mark the verified release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f make_latest=true >/dev/null
